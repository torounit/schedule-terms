name: Lint
on:
    pull_request:
        paths-ignore:
            - '**.md'
    push:
        branches: [main]
        paths-ignore:
            - '**.md'
    workflow_call:

jobs:
    lint-js:
        name: Lint JS
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            # Blocks malicious npm packages: npm and npx run through Aikido Safe Chain from here on.
            - name: Install Aikido Safe Chain
              run: |
                  curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o /tmp/install-safe-chain.sh
                  echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  /tmp/install-safe-chain.sh" | sha256sum -c -
                  sh /tmp/install-safe-chain.sh --ci
                  rm /tmp/install-safe-chain.sh

            - name: Install Node dependencies
              run: npm ci

            - name: Run JS lint
              run: npm run lint-js

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            # Blocks malicious npm packages: npm and npx run through Aikido Safe Chain from here on.
            - name: Install Aikido Safe Chain
              run: |
                  curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o /tmp/install-safe-chain.sh
                  echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  /tmp/install-safe-chain.sh" | sha256sum -c -
                  sh /tmp/install-safe-chain.sh --ci
                  rm /tmp/install-safe-chain.sh

            - name: Install Node dependencies
              run: npm ci

            - name: Run type check
              run: npm run lint:type

    lint-php:
        name: Lint PHP
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHP lint
              run: composer lint
